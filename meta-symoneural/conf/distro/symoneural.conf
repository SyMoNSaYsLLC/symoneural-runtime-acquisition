# SyMoNeuRaL distro configuration.
#
# 10a: Fortran estate-wide. The stock OE cross toolchain is built
# LANGUAGES="c,c++"; scipy requires a Fortran compiler, and Ravencalc ships
# scipy, so the toolchain must provide it. libquadmath accompanies gfortran.
FORTRAN:forcevariable = ",fortran"
# libgfortran is the PRIMARY Fortran runtime and must be named explicitly:
# OE-Core's default RUNTIMETARGET is
#   "${RUNTIMELIBSSP} libstdc++-v3 libgomp libatomic ${RUNTIMELIBITM} ..."
# which does NOT include it. Enabling FORTRAN above builds the COMPILER but not
# its target-side runtime, and the two are separate things.
#
# Symptom when only libquadmath was listed (as it was until Phase 11):
#   x86_64-oe-linux-gfortran: fatal error: cannot read spec file
#   'libgfortran.spec': No such file or directory
#   ../pristine/meson.build:91:2: ERROR: Compiler x86_64-oe-linux-gfortran ...
#   cannot compile programs.
# The compiler ran fine standalone - it only fails WITH --sysroot, because that is
# when it needs the target runtime. A bare `gfortran -c t.f90` test passes and
# proves nothing; scipy was the first real consumer and found it.
RUNTIMETARGET:append:pn-gcc-runtime = " libgfortran libquadmath"
