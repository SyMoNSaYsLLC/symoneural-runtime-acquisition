# SyMoNeuRaL layer. Holds every SyMoNeuRaL-authored recipe and class.
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"
BBFILE_COLLECTIONS += "symoneural"
BBFILE_PATTERN_symoneural = "^${LAYERDIR}/"
BBFILE_PRIORITY_symoneural = "10"
LAYERDEPENDS_symoneural = "core"
LAYERSERIES_COMPAT_symoneural = "scarthgap wrynose blacksail"
